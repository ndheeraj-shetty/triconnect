version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: triconnect_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: triconnect_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/backend
      - uploads_volume:/backend/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/triconnect
      - APP_ENV=production
      - DEBUG=False
    depends_on:
      - db

volumes:
  pgdata:
  uploads_volume:
